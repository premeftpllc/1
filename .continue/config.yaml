models:
  - name: Local Qwen 3.5 9B
    provider: lmstudio
    model: qwen/qwen3.5-9b
    apiBase: http://127.0.0.1:1235
    roles:
      - chat
      - edit
      - apply
      - autocomplete

  - name: OpenAI GPT-4.1 mini
    provider: openai
    model: gpt-4.1-mini-2025-04-14
    apiKey: $OPENAI_API_KEY
    roles:
      - chat
      - edit
      - apply

  - name: Claude Haiku
    provider: anthropic
    model: claude-3-5-haiku-20241022
    apiKey: $ANTHROPIC_API_KEY
    roles:
      - chat

# Keep the local model as the default for coding and autocomplete when LM Studio is running.
tabAutocompleteModel:
  name: Local Qwen 3.5 9B
  provider: lmstudio
  model: qwen/qwen3.5-9b
  apiBase: http://127.0.0.1:1235
  roles:
    - autocomplete

# Optional: set these in your shell before launching VS Code or Continue.
# export OPENAI_API_KEY="..."
# export ANTHROPIC_API_KEY="..."
