# Continue MCP Servers Configuration
# Environment variables referenced below should be set in .env or system environment
# Place API keys/tokens in your shell profile or use direnv

mcpServers:

  # ============================================================================
  # AIRTABLE
  # ============================================================================
  airtable:
    command: npx
    args:
      - airtable-mcp
    env:
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID}
    description: "Airtable - Read/write bases, tables, records"

  # ============================================================================
  # MAKE.COM
  # ============================================================================
  make:
    command: npx
    args:
      - make-mcp
    env:
      MAKE_API_KEY: ${MAKE_API_KEY}
      MAKE_TEAM_ID: ${MAKE_TEAM_ID}
    description: "Make.com - Query scenarios, executions, data stores"

  # ============================================================================
  # GMAIL
  # ============================================================================
  gmail:
    command: npx
    args:
      - gmail-mcp
    env:
      GOOGLE_CREDENTIALS_PATH: ${GOOGLE_CREDENTIALS_PATH}
    description: "Gmail - Read/send emails, manage labels"

  # ============================================================================
  # SHOPIFY
  # ============================================================================
  shopify:
    command: npx
    args:
      - shopify-mcp
    env:
      SHOPIFY_STORE_URL: ${SHOPIFY_STORE_URL}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}
    description: "Shopify - Query products, orders, inventory"

  # ============================================================================
  # NOTION
  # ============================================================================
  notion:
    command: npx
    args:
      - notion-mcp
    env:
      NOTION_API_KEY: ${NOTION_API_KEY}
    description: "Notion - Read/write pages, databases, properties"

  # ============================================================================
  # SLACK
  # ============================================================================
  slack:
    command: npx
    args:
      - slack-mcp
    env:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID}
    description: "Slack - Send messages, read channels, manage conversations"

# ============================================================================
# REQUIRED ENVIRONMENT VARIABLES
# ============================================================================
# Set these in your shell profile or .env file:
#
# AIRTABLE_TOKEN=pat_YOUR_TOKEN (from airtable.com/account/tokens)
# AIRTABLE_BASE_ID=appXXXX (optional, from Airtable base URL)
#
# MAKE_API_KEY=sk_live_YOUR_KEY (from Make → Profile → API)
# MAKE_TEAM_ID=YOUR_TEAM_ID (from Make org settings)
#
# GOOGLE_CREDENTIALS_PATH=~/.continue/google-credentials.json
# (Download from Google Cloud Console)
#
# SHOPIFY_STORE_URL=premeftpshop.myshopify.com
# SHOPIFY_ACCESS_TOKEN=shppa_YOUR_TOKEN (from Shopify → Apps)
#
# NOTION_API_KEY=ntn_YOUR_TOKEN (from notion.so/my-integrations)
#
# SLACK_BOT_TOKEN=xoxb_YOUR_TOKEN (from api.slack.com/apps)
# SLACK_TEAM_ID=T_YOUR_TEAM_ID (from Slack admin)

# ============================================================================
# HOW TO USE
# ============================================================================
# 1. Set environment variables (see above)
# 2. Restart Continue IDE
# 3. In Continue chat, you can now use MCP tools from all configured servers
# 4. Example: "Query my Airtable base" or "List Make.com scenarios"
#
# For PC/Mac sync:
# - Add this file to git (.gitignore the actual tokens)
# - Use ~/.zshrc or ~/.bashrc to set environment variables locally
# - Or use direnv (.envrc file in project root)
