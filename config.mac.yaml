name: Nemotron-3-Nano-4B MacBook Neo Config (Local LM Studio)
version: 1.0.0
schema: v1

# NOTE: This is the Mac-optimized config with lower context window
# Synced from PC master via git
# Use this instead of config.yaml on Mac

models:
  - name: nemotron-3-nano-4b
    provider: lmstudio
    model: nvidia/nemotron-3-nano-4b
    apiBase: http://localhost:1235/v1
    roles:
      - chat
      - autocomplete
      - edit
      - apply
      - refactor
      - rewrite
      - explain
      - docs
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 160000  # Mac-optimized: lower context (vs 500K on PC)
      maxTokens: 80000       # Proportional to context window
    requestOptions:
      timeout: 300000
  - name: Nomic Embed Text v1.5
    provider: lmstudio
    model: text-embedding-nomic-embed-text-v1.5
    apiBase: http://localhost:1235/v1
    requestOptions:
      timeout: 300000

# MCP Servers: All configured, credentials loaded from .env.local
# Add your tokens/keys to .env.local - they're referenced here via $ENV_VAR syntax
mcpServers:
  # Essential: Always running
  - name: web-search
    command: node
    args:
      - ~/.continue/web-search-mcp/dist/index.js
    env:
      BROWSER_HEADLESS: "true"
      BROWSER_TYPES: chromium
      MAX_BROWSERS: "1"
      DEFAULT_TIMEOUT: "30000"
      MAX_CONTENT_LENGTH: "50000"

  - name: clock
    command: node
    args:
      - ~/.continue/mcp-clock.mjs

  # Automation & Workflows
  - name: make-custom-mcp
    command: node
    args:
      - ~/.continue/mcp-make-bridge.js
    env:
      MAKE_API_KEY: ${MAKE_API_KEY}
      MAKE_TEAM_ID: ${MAKE_TEAM_ID}
      MAKE_MCP_AUTHORIZATION: ${MAKE_MCP_AUTHORIZATION}

  # Knowledge & Data
  - name: notion
    command: node
    args:
      - ~/.continue/mcp-notion-launcher.js
    env:
      NOTION_TOKEN: ${NOTION_TOKEN}

  - name: airtable
    command: node
    args:
      - ~/.continue/mcp-airtable-launcher.js
    env:
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN}

  # Communication
  - name: slack
    command: node
    args:
      - ~/.continue/mcp-slack-launcher.js
    env:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}

  # Google Workspace
  - name: gmail
    command: node
    args:
      - ~/.continue/mcp-gmail-launcher.js
    env:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

  - name: google-calendar
    command: node
    args:
      - ~/.continue/mcp-calendar-launcher.js
    env:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

  - name: google-drive
    command: node
    args:
      - ~/.continue/mcp-drive-launcher.js
    env:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

  # E-Commerce & Integrations
  - name: shopify
    command: node
    args:
      - ~/.continue/mcp-shopify-launcher.js
    env:
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}
      SHOPIFY_SHOP_URL: ${SHOPIFY_SHOP_URL}

  - name: zapier
    command: node
    args:
      - ~/.continue/mcp-zapier-bridge.mjs
    env:
      ZAPIER_MCP_URL: ${ZAPIER_MCP_URL}

# Model selection for each role/field
modelRoles:
  default: nemotron-3-nano-4b
  chat: nemotron-3-nano-4b
  autocomplete: nemotron-3-nano-4b
  edit: nemotron-3-nano-4b
  apply: nemotron-3-nano-4b
  refactor: nemotron-3-nano-4b
  rewrite: nemotron-3-nano-4b
  explain: nemotron-3-nano-4b
  docs: nemotron-3-nano-4b
  embed: Nomic Embed Text v1.5

# Settings for different operations
settings:
  autocomplete:
    enabled: true
    maxTokens: 2048
    useCache: true
    temperature: 0.3

  edit:
    showDiff: true
    allowMultiFile: true
    requestConfirmation: true
    maxFiles: 10
    temperature: 0.3

  apply:
    maxFiles: 5
    dryRun: false
    showSummary: true
    temperature: 0.2

  chat:
    systemPrompt: "You are an expert AI developer assistant with access to live MCP tools. Help developers write code, debug issues, understand complex systems, and improve their workflow."
    markdown: true
    codeBlockStyle: fenced
    temperature: 0.3

  refactor:
    temperature: 0.3

  explain:
    temperature: 0.3

  docs:
    temperature: 0.3
