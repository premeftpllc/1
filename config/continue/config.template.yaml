# Rendered into ~/.continue/config.yaml by `python3 scripts/workspace.py config --apply`.
# The context and output limits are filled in from the machine profile in scripts/workspace.py.
# Keep models here only: MCP servers come from config/continue/mcpServers/ and rules from
# .continue/rules/, so every machine shares them through git.
name: PremeOS ({{CHAT_MODEL_NAME}}, local LM Studio)
version: 1.0.0
schema: v1
models:
  - name: {{CHAT_MODEL_NAME}}
    provider: lmstudio
    model: {{CHAT_MODEL}}
    apiBase: http://127.0.0.1:1235/v1
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: {{CONTEXT}}
      maxTokens: {{MAX_TOKENS}}
    requestOptions:
      timeout: 300000
  - name: Qwen2.5-Coder 1.5B (autocomplete)
    # Code model trained for fill-in-the-middle; Continue recommends it for local tab completion.
    # Download: lms get https://huggingface.co/lmstudio-community/Qwen2.5-Coder-1.5B-Instruct-GGUF -y
    provider: lmstudio
    model: qwen2.5-coder-1.5b-instruct
    apiBase: http://127.0.0.1:1235/v1
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      modelTimeout: 150
  - name: Nomic Embed Text v1.5
    provider: lmstudio
    model: text-embedding-nomic-embed-text-v1.5
    apiBase: http://127.0.0.1:1235/v1
    roles:
      - embed
    requestOptions:
      timeout: 300000
  - name: Voyage Rerank-2
    provider: voyage
    model: rerank-2
    apiKey: "${{ secrets.VOYAGE_API_KEY }}"
    roles:
      - rerank
