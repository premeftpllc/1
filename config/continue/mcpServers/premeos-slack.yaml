name: PremeOS Slack
version: 1.0.0
schema: v1
mcpServers:
  - name: slack
    # User token (xoxp), as on the PC: the bot token fails with missing_scope because its
    # scopes were added under User Token Scopes. To use the bot token instead, move the scopes
    # to Bot Token Scopes, reinstall the app, and swap in SLACK_MCP_XOXB_TOKEN here.
    command: npx
    args:
      - "-y"
      - "slack-mcp-server@1.3.0"
      - "--transport"
      - "stdio"
    env:
      SLACK_MCP_XOXP_TOKEN: "${{ secrets.SLACK_MCP_XOXP_TOKEN }}"
      SLACK_TEAM_ID: "${{ secrets.SLACK_TEAM_ID }}"
