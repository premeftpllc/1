name: PremeOS Web Search
version: 1.0.0
schema: v1
mcpServers:
  - name: web-search
    # The repo's web-search-mcp build (get-web-search-summaries, full-web-search,
    # get-single-web-page-content), which the rules name. Build it once per machine:
    #   cd web-search-mcp && npm ci && npm run build && npx playwright install chromium
    command: node
    args:
      - "{{PREMEOS_REPO}}/web-search-mcp/dist/index.js"
    env:
      BROWSER_HEADLESS: "true"
      BROWSER_TYPES: chromium
      MAX_BROWSERS: "1"
      DEFAULT_TIMEOUT: "30000"
      MAX_CONTENT_LENGTH: "50000"
