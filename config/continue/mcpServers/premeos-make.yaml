name: PremeOS Make
version: 1.0.0
schema: v1
mcpServers:
  - name: make
    # Make hosted MCP (us2). Advertises about 146 tools (~40K prompt tokens) and includes
    # write/delete tools: switch it off in Continue > Tools when not needed; keep tools on "Ask first".
    type: streamable-http
    url: https://us2.make.com/mcp
    requestOptions:
      headers:
        Authorization: "Bearer ${{ secrets.MAKE_MCP_AUTHORIZATION }}"
