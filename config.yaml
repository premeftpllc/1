name: Local Qwen LM Studio Config
version: 1.0.0
schema: v1
models:
  - name: nemotron-3-nano-4b
    provider: lmstudio
    model: nvidia/nemotron-3-nano-4b
    apiBase: http://127.0.0.1:1235/v1
    roles:
      - chat
      - autocomplete
      - edit
      - apply
      - refactor
      - rewrite
      - explain
      - docs
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 4096
      maxTokens: 2048
    requestOptions:
      timeout: 300000
  - name: Nomic Embed Text v1.5
    provider: lmstudio
    model: text-embedding-nomic-embed-text-v1.5
    apiBase: http://127.0.0.1:1235/v1
    roles:
      - embed
    requestOptions:
      timeout: 300000
  - name: Autodetect
    provider: lmstudio
    model: AUTODETECT
    apiBase: http://127.0.0.1:1235/v1
mcpServers:
  - name: web-search
    command: node
    args:
      - C:/Users/Administrator/.continue/web-search-mcp/dist/index.js
    env:
      BROWSER_HEADLESS: "true"
      BROWSER_TYPES: chromium
      MAX_BROWSERS: "1"
      DEFAULT_TIMEOUT: "10000"
      MAX_CONTENT_LENGTH: "10000"
  - name: clock
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-clock.mjs
  - name: make-custom-mcp
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-make-bridge.js
  - name: notion
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-notion-launcher.js
  - name: airtable
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-airtable-launcher.js
  - name: slack
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-slack-launcher.js
  - name: gmail
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-gmail-launcher.js
  - name: google-calendar
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-calendar-launcher.js
  - name: google-drive
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-drive-launcher.js
  - name: shopify
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-shopify-launcher.js
  - name: zapier
    command: node
    args:
      - C:/Users/Administrator/.continue/mcp-zapier-bridge.mjs

# Model selection for each role/field
modelRoles:
  default: nemotron-3-nano-4b
  chat: nemotron-3-nano-4b
  autocomplete: nemotron-3-nano-4b
  edit: nemotron-3-nano-4b
  apply: nemotron-3-nano-4b
  refactor: nemotron-3-nano-4b
  rewrite: nemotron-3-nano-4b
  explain: nemotron-3-nano-4b
  docs: nemotron-3-nano-4b
  embed: Nomic Embed Text v1.5

# Settings for different operations
settings:
  autocomplete:
    enabled: true
    maxTokens: 512
    useCache: true

  edit:
    showDiff: true
    allowMultiFile: true
    requestConfirmation: true
    maxFiles: 10

  apply:
    maxFiles: 5
    dryRun: false
    showSummary: true

  chat:
    systemPrompt: "You are an expert AI developer assistant. Help developers write code, debug issues, understand complex systems, and improve their workflow."
    markdown: true
    codeBlockStyle: fenced
